<div class="realtimelink-container">
    <!-- Mensaje de expiración (Pantalla completa) -->
    <div class="expired-overlay" *ngIf="isExpired">
        <div class="expired-content">
            <div class="expired-icon">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" />
                </svg>
            </div>
            <h2>Link Expirado</h2>
            <p>Este enlace de seguimiento en tiempo real ha expirado y ya no está disponible.</p>
        </div>
    </div>

    <!-- Contenido normal (solo visible si no ha expirado) -->
    <ng-container *ngIf="!isExpired">
        <div #mapContainer class="map-container"></div>

        <!-- Contador de expiración -->
        <div class="expiration-timer" *ngIf="expirationDate">
            <div class="timer-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.2 3.2.8-1.3-4.5-2.7V7z" />
                </svg>
            </div>
            <div class="timer-content">
                <div class="timer-label">Link expira en</div>
                <div class="timer-value">{{ timeRemaining }}</div>
            </div>
        </div>

        <!-- Botones flotantes de navegación -->
        <div class="floating-buttons" *ngIf="target">
            <button class="nav-button google-maps-btn" (click)="openInGoogleMaps()" title="Abrir en Google Maps">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" />
                </svg>
                <span>Google Maps</span>
            </button>

            <button class="nav-button waze-btn" (click)="openInWaze()" title="Abrir en Waze">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" />
                </svg>
                <span>Waze</span>
            </button>
        </div>
    </ng-container>
</div>
