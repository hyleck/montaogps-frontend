<div class="card">
    <p-toast></p-toast>
    <p-confirmDialog [style]="{width: '450px'}" styleClass="app-dark-dialog"></p-confirmDialog>
    <p-toolbar styleClass="mb-4 gap-2">
        <ng-template pTemplate="left">
            <button pButton pRipple label="New" icon="pi pi-plus" class="p-button-success mr-2"
                (click)="openNew()"></button>
        </ng-template>
    </p-toolbar>

    <p-table #dt [value]="forms" [rows]="10" [paginator]="true" [loading]="loading"
        [globalFilterFields]="['name','description']" [tableStyle]="{'min-width': '50rem'}" [rowHover]="true"
        dataKey="_id" currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
        [showCurrentPageReport]="true">
        <ng-template pTemplate="caption">
            <div class="flex align-items-center justify-content-between">
                <h5 class="m-0">Manage Forms</h5>
            </div>
        </ng-template>
        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="name">Name <p-sortIcon field="name"></p-sortIcon></th>
                <th pSortableColumn="description">Description <p-sortIcon field="description"></p-sortIcon></th>
                <th>Actions</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-form>
            <tr>
                <td>{{form.name}}</td>
                <td>{{form.description}}</td>
                <td>
                    <button pButton pRipple icon="pi pi-pencil" class="p-button-rounded p-button-success mr-2"
                        (click)="editForm(form)"></button>
                    <button pButton pRipple icon="pi pi-trash" class="p-button-rounded p-button-warning"
                        (click)="deleteForm(form)"></button>
                </td>
        </ng-template>
    </p-table>

    <p-dialog [(visible)]="formDialog" [style]="{width: '600px', 'max-height': '90vh'}" header="Form Details"
        [modal]="true" [contentStyle]="{overflow: 'auto', 'max-height': '80vh'}" styleClass="app-dark-dialog"
        appendTo="body">
        <ng-template pTemplate="content">
            <div class="field mb-4">
                <label for="name"
                    style="display: block; margin-bottom: 0.6rem; font-weight: 500; color: #e5e7eb; font-size: 0.875rem;">Name</label>
                <input type="text" pInputText id="name" [(ngModel)]="form.name" required autofocus
                    style="background: rgba(55, 65, 81, 0.5) !important; border: 1.5px solid rgba(107, 114, 128, 0.4) !important; color: #f9fafb !important; padding: 0.65rem 1rem !important; font-size: 0.95rem !important; border-radius: 8px !important; width: 100% !important;" />
                <small class="p-error block mt-1" *ngIf="submitted && !form.name">Name is required.</small>
            </div>

            <div class="field mb-4">
                <label for="description"
                    style="display: block; margin-bottom: 0.6rem; font-weight: 500; color: #e5e7eb; font-size: 0.875rem;">Description</label>
                <textarea id="description" pInputTextarea [(ngModel)]="form.description" rows="3" autoResize="true"
                    style="background: rgba(55, 65, 81, 0.5) !important; border: 1.5px solid rgba(107, 114, 128, 0.4) !important; color: #f9fafb !important; padding: 0.75rem 1rem !important; font-size: 0.95rem !important; border-radius: 8px !important; width: 100% !important; line-height: 1.6 !important; box-sizing: border-box !important;">
                </textarea>
            </div>

            <div class="field mb-4">
                <label for="tag"
                    style="display: block; margin-bottom: 0.6rem; font-weight: 500; color: #e5e7eb; font-size: 0.875rem;">Tag</label>
                <p-dropdown id="tag" [options]="tags" [(ngModel)]="form.tag" optionLabel="name" optionValue="_id"
                    placeholder="Select a Tag" appendTo="body"
                    [style]="{'width':'100%', 'background': 'rgba(55, 65, 81, 0.5)', 'border': '1.5px solid rgba(107, 114, 128, 0.4)', 'border-radius': '8px'}"></p-dropdown>
            </div>

            <div class="form-fields-container mt-4"
                style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1.5rem;">
                <div class="flex justify-content-between align-items-center mb-3">
                    <h5 class="m-0 text-white font-medium">Form Fields</h5>
                    <button pButton pRipple type="button" icon="pi pi-plus" label="Add Field"
                        class="p-button-sm p-button-success" style="border-radius: 6px;" (click)="addField()"></button>
                </div>

                <div *ngFor="let field of form.fields; let i = index"
                    class="field-row mb-3 p-3 flex align-items-center gap-3"
                    style="background: rgba(255,255,255,0.05); border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);">
                    <div class="flex-1">
                        <span class="p-float-label">
                            <input pInputText [(ngModel)]="field.label" placeholder="Label"
                                style="width: 100%; background: rgba(0,0,0,0.2) !important; border: 1px solid rgba(255,255,255,0.1) !important; border-radius: 4px;" />
                        </span>
                    </div>
                    <div class="flex-1">
                        <p-dropdown [options]="fieldTypes" [(ngModel)]="field.type" placeholder="Type" appendTo="body"
                            [style]="{'width':'100%', 'background': 'rgba(0,0,0,0.2)', 'border': '1px solid rgba(255,255,255,0.1)', 'border-radius': '4px'}"></p-dropdown>
                    </div>
                    <div class="flex align-items-center gap-2">
                        <p-checkbox [(ngModel)]="field.required" [binary]="true" label="Req"></p-checkbox>
                    </div>
                    <button pButton pRipple type="button" icon="pi pi-trash"
                        class="p-button-rounded p-button-danger p-button-text" (click)="removeField(i)"></button>
                </div>

                <div *ngIf="form.fields.length === 0" class="text-center p-4"
                    style="background: rgba(255,255,255,0.02); border-radius: 8px; border: 1px dashed rgba(255,255,255,0.1);">
                    <small class="text-400">No fields added yet. Click "Add Field" to start.</small>
                </div>
            </div>
        </ng-template>

        <ng-template pTemplate="footer">
            <button pButton pRipple label="Cancel" icon="pi pi-times" class="p-button-text"
                (click)="hideDialog()"></button>
            <button pButton pRipple label="Save" icon="pi pi-check" class="p-button-text" (click)="saveForm()"></button>
        </ng-template>
    </p-dialog>
</div>
