<div class="card">
    <p-toast></p-toast>
    <p-confirmDialog [style]="{width: '450px'}" styleClass="app-dark-dialog"></p-confirmDialog>
    <p-toolbar styleClass="mb-4 gap-2">
        <ng-template pTemplate="left">
            <button pButton pRipple label="New" icon="pi pi-plus" class="p-button-success mr-2"
                (click)="openNew()"></button>
        </ng-template>
    </p-toolbar>

    <p-table #dt [value]="forms" [rows]="10" [paginator]="true" [loading]="loading"
        [globalFilterFields]="['name','description']" [tableStyle]="{'min-width': '50rem'}" [rowHover]="true"
        dataKey="_id" currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
        [showCurrentPageReport]="true" styleClass="app-dark-table">
        <ng-template pTemplate="caption">
            <div class="flex align-items-center justify-content-between">
                <h5 class="m-0 font-medium">Administrar Formularios</h5>
            </div>
        </ng-template>
        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="name">Nombre <p-sortIcon field="name"></p-sortIcon></th>
                <th pSortableColumn="description">Descripción <p-sortIcon field="description"></p-sortIcon></th>
                <th>Acciones</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-form>
            <tr>
                <td>{{form.name}}</td>
                <td>{{form.description}}</td>
                <td>
                    <div style="display: flex; gap: 12px; justify-content: center; align-items: center;">
                        <button pButton pRipple icon="pi pi-pencil" class="p-button-rounded p-button-success"
                            (click)="editForm(form)"></button>
                        <button pButton pRipple icon="pi pi-trash" class="p-button-rounded p-button-danger"
                            (click)="deleteForm(form)"></button>
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>

    <p-dialog [(visible)]="formDialog" [style]="{width: '95vw', maxWidth: '1000px', 'max-height': '90vh'}"
        [breakpoints]="{'1100px': '90vw', '960px': '95vw'}" header="Detalles del Formulario" [modal]="true"
        [contentStyle]="{overflow: 'auto', 'max-height': '80vh'}" styleClass="app-dark-dialog customizer-dialog"
        appendTo="body">
        <ng-template pTemplate="content">
            <div class="customizer-grid">
                <!-- Column 1: Main Details -->
                <div class="customizer-col main-details">
                    <h3 class="m-0 mb-4 text-xl font-bold opacity-80">Información General</h3>

                    <div class="field mb-4">
                        <label for="name" class="font-bold block mb-2">Nombre del Formulario</label>
                        <input id="name" type="text" [(ngModel)]="form.name" required autofocus
                            class="native-input w-full" placeholder="Ej: Reporte de Mantenimiento" />
                        <small class="p-error block mt-1" *ngIf="submitted && !form.name">El nombre es
                            requerido.</small>
                    </div>

                    <div class="field mb-4">
                        <label for="description" class="font-bold block mb-2">Descripción</label>
                        <textarea id="description" [(ngModel)]="form.description" required rows="5"
                            class="native-textarea w-full"
                            placeholder="Describa para qué sirve este formulario..."></textarea>
                    </div>

                    <div class="field mb-4">
                        <label for="tag" class="font-bold block mb-2">Etiqueta Vinculada (Tag)</label>
                        <select id="tag" [(ngModel)]="form.tag" class="native-select w-full">
                            <option [ngValue]="null">Ninguna (Global)</option>
                            <option *ngFor="let tag of tags" [value]="tag._id">{{ tag.name }}</option>
                        </select>
                        <small class="text-sm opacity-60 mt-1 block">Los dispositivos con este tag podrán usar el
                            formulario.</small>
                    </div>
                </div>

                <!-- Column 2: Dynamic Fields -->
                <div class="customizer-col fields-list">
                    <div class="flex justify-content-between align-items-center mb-4">
                        <h3 class="m-0 text-xl font-bold opacity-80">Configuración de Campos</h3>
                        <button pButton pRipple type="button" label="Nuevo Campo" icon="pi pi-plus"
                            class="p-button-sm p-button-success" style="border-radius: 6px;"
                            (click)="addField()"></button>
                    </div>

                    <div class="fields-scroll-container">
                        <div class="field-row true-row p-2 mb-2 border-round-lg shadow-1"
                            *ngFor="let field of form.fields; let i = index">
                            <!-- Title -->
                            <div class="flex-field-title">
                                <input type="text" [(ngModel)]="field.label" placeholder="Título"
                                    class="native-input native-input-small no-w-full" />
                            </div>

                            <!-- Type -->
                            <div class="flex-field-type">
                                <select [(ngModel)]="field.type" class="native-select native-select-small no-w-full">
                                    <option *ngFor="let type of fieldTypes" [value]="type.value">{{ type.label }}
                                    </option>
                                </select>
                            </div>

                            <!-- Placeholder -->
                            <div class="flex-field-placeholder">
                                <input type="text" [(ngModel)]="field.placeholder" placeholder="Ayuda / Placeholder"
                                    class="native-input native-input-small no-w-full" />
                            </div>


                            <!-- Delete -->
                            <div class="no-shrink">
                                <button pButton pRipple icon="pi pi-trash"
                                    class="p-button-rounded p-button-danger p-button-text p-button-sm"
                                    (click)="removeField(i)"></button>
                            </div>
                        </div>

                        <div *ngIf="form.fields.length === 0" class="text-center p-5 border-round-xl empty-fields-card">
                            <i class="pi pi-list text-4xl opacity-20 mb-3 block"></i>
                            <span class="opacity-50">No hay campos configurados</span>
                            <p class="text-sm opacity-40 mt-1">Haga clic en "Nuevo Campo" para comenzar</p>
                        </div>
                    </div>
                </div>
            </div>
        </ng-template>

        <ng-template pTemplate="footer">
            <button pButton pRipple label="Cancelar" icon="pi pi-times" class="p-button-secondary p-button-outlined"
                (click)="hideDialog()"></button>
            <button pButton pRipple label="Guardar" icon="pi pi-check" class="p-button-success"
                (click)="saveForm()"></button>
        </ng-template>
    </p-dialog>
</div>
