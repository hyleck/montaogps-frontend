<div class="management__route">
    <p-breadcrumb [model]="items" [home]="home" />
</div>

<!-- Tarjetas de configuración, listas de las diferentes configuraciones que se pueden hacer -->
<div class="settings">
    <div *ngFor="let card of filteredSettingsCards" class="settings__card"
        [ngClass]="{'settings__card--disabled': card.disabled}"
        (click)="!card.disabled && navigateTo($any(card).route, card.action)">
        <div class="settings__card-header">
            <i [class]="card.icon"></i>
            <h3>
                {{ card.titleKey | translate }}
                <i class="pi pi-spin pi-spinner analysis-spinner"
                    *ngIf="isHistorialesCard(card) && isHistorialesAnalysisRunning" title="Análisis en progreso"></i>
            </h3>
        </div>
        <p class="settings__card-description">{{ card.descriptionKey | translate }}</p>
        <div *ngIf="card.disabled" class="settings__card-disabled-badge">
            {{ 'settings.disabled' | translate }}
        </div>
    </div>
</div>


<div class="card flex justify-content-center">

    <p-dialog [header]="'settings.dialogs.roles' | translate" [modal]="true" [(visible)]="RolesFormDisplay">
        <app-user-roles-settings></app-user-roles-settings>
    </p-dialog>

    <p-dialog [header]="'settings.dialogs.system' | translate" [modal]="true" [(visible)]="SystemSettingsDisplay"
        [style]="{width: '70vw', maxWidth: '900px'}" [contentStyle]="{overflow: 'auto'}" styleClass="app-dark-dialog">
        <app-system-settings></app-system-settings>
    </p-dialog>

    <p-dialog [header]="'settings.dialogs.servers' | translate" [modal]="true" [(visible)]="ServersSettingsDisplay"
        [style]="{width: '70vw', maxWidth: '900px'}" [contentStyle]="{overflow: 'auto'}" styleClass="app-dark-dialog">

    <p-dialog [header]="'settings.dialogs.colors' | translate" [modal]="true" [(visible)]="ColorsSettingsDisplay"
        [style]="{width: '70vw', maxWidth: '900px'}" [contentStyle]="{overflow: 'auto'}" styleClass="app-dark-dialog">
        <app-colors-settings></app-colors-settings>
    </p-dialog>

    <p-dialog [header]="'settings.dialogs.brands' | translate" [modal]="true" [(visible)]="VehicleBrandsSettingsDisplay"
        [style]="{width: '80vw', maxWidth: '950px'}" [contentStyle]="{overflow: 'auto'}" styleClass="app-dark-dialog">
        <app-vehicle-brands-settings></app-vehicle-brands-settings>

    <p-dialog [header]="'settings.dialogs.models' | translate" [modal]="true" [(visible)]="VehicleModelsSettingsDisplay"

    <p-dialog [header]="'settings.sectors.title' | translate" [modal]="true" [(visible)]="SectorsSettingsDisplay"

    <p-dialog [header]="'settings.dialogs.protocols' | translate" [modal]="true" [(visible)]="ProtocolsSettingsDisplay"

    <p-dialog [header]="'settings.dialogs.historiales' | translate" [modal]="true"

    <p-dialog [header]="'settings.support.title' | translate" [modal]="true" [(visible)]="SupportSettingsDisplay"
        [style]="{width: '60vw', maxWidth: '1000px'}" [contentStyle]="{overflow: 'auto'}" styleClass="app-dark-dialog">

    <p-dialog [header]="'settings.customizer.title' | translate" [modal]="true" [(visible)]="CustomizerSettingsDisplay"

    <p-dialog [header]="'settings.tags.title' | translate" [modal]="true" [(visible)]="TagsSettingsDisplay"

    <p-dialog [header]="'settings.pushManager.title' | translate" [modal]="true"

    <p-dialog header="Membresías" [modal]="true" [(visible)]="MembresiasSettingsDisplay"

    </p-dialog>

</div>
