<div class="main">
    <div *ngIf="sidebarDisplayed" class="sidebar">
        <div class="sidebar__logo">
            <div class="sidebar__logo-img">
                <img [src]="systemLogo" alt="System Logo">
            </div>
            <div (click)="toggleSidebar()" class="sidebar__hide-button">
                <i class="pi pi-window-minimize"></i>
            </div>
        </div>
        <div class="sidebar__options">
            <div class="sidebar__favorites" *ngIf="filteredFavoriteItems.length > 0">
                <div class="sidebar__title">
                    <span>{{sidaberOptions.favoriteTitle}}</span>
                </div>
                <div [routerLink]="item.path" routerLinkActive="sidebar__option--active"
                    *ngFor="let item of filteredFavoriteItems" class="sidebar__option ">
                    <div class="sidebar__option-icon"> <i class="{{ item.icon }}"></i></div>
                    <div class="sidebar__option-text"> <span>{{ item.label }}</span></div>
                    <div *ngIf="item.badge !== 0" class="sidebar__option-badge"><p-badge severity="info"
                            [value]="item.badge" /></div>
                </div>


            </div>
            <div class="sidebar__menu">
                <div *ngIf="sidaberOptions.principalItems" class="sidebar__title">
                    <span>{{sidaberOptions.principalTitle}}</span>
                </div>
                <div [routerLink]="item.path === '/admin/montao-rent' ? null : item.path"
                    [routerLinkActive]="item.path === '/admin/montao-rent' ? '' : 'sidebar__option--active'"
                    (click)="handleItemClick($event, item)" *ngFor="let item of filteredPrincipalItems"
                    class="sidebar__option ">
                    <div class="sidebar__option-icon"> <i class="{{ item.icon }}"></i></div>
                    <div class="sidebar__option-text"> <span>{{ item.label }}</span></div>
                    <div *ngIf="item.badge !== 0" class="sidebar__option-badge"><p-badge
                            [severity]="item.path === '/admin/inventory' ? 'warn' : 'info'" [value]="item.badge" />
                    </div>
                </div>



            </div>
            <div class="sidebar__profile">
                <div *ngIf="sidaberOptions.profileItems" class="sidebar__title">
                    <span>{{sidaberOptions.profileTitle}}</span>
                </div>
                <div [routerLink]="item.path" routerLinkActive="sidebar__option--active"
                    *ngFor="let item of filteredProfileItems" class="sidebar__option">
                    <div class="sidebar__option-icon">
                        <img *ngIf="item.path === '/admin/profile' && userPhotoUrl" [src]="userPhotoUrl"
                            class="sidebar-user-photo" alt="User">
                        <i *ngIf="!(item.path === '/admin/profile' && userPhotoUrl)" class="{{ item.icon }}"></i>
                    </div>
                    <div class="sidebar__option-text"> <span>{{ item.label }}</span></div>
                    <div *ngIf="item.badge !== 0" class="sidebar__option-badge"><p-badge severity="info"
                            [value]="item.badge" /></div>
                </div>

            </div>
        </div>
    </div>



    <div *ngIf="!sidebarDisplayed" class="sidebar sidebar--mobile">
        <div class="sidebar__logo">

            <div (click)="toggleSidebar()" class="sidebar__hide-button">
                <i class="pi pi-window-maximize"></i>
            </div>
        </div>
        <div class="sidebar__options">
            <div class="sidebar__favorites" *ngIf="filteredFavoriteItems.length > 0">
                <div class="sidebar__title">
                    <span>{{sidaberOptions.favoriteTitle}}</span>
                </div>
                <div [routerLink]="item.path" routerLinkActive="sidebar__option--active"
                    *ngFor="let item of filteredFavoriteItems" class="sidebar__option ">
                    <div *ngIf="item.badge !== 0" class="sidebar__option-icon"> <i class="{{ item.icon }}" pBadge
                            severity="info" [value]="item.badge"></i></div>
                    <div *ngIf="item.badge === 0" class="sidebar__option-icon"> <i class="{{ item.icon }}"></i></div>
                </div>


            </div>
            <div class="sidebar__menu">
                <div *ngIf="sidaberOptions.principalItems" class="sidebar__title">
                    <span>{{sidaberOptions.principalTitle}}</span>
                </div>
                <div [routerLink]="item.path === '/admin/montao-rent' ? null : item.path"
                    [routerLinkActive]="item.path === '/admin/montao-rent' ? '' : 'sidebar__option--active'"
                    (click)="handleItemClick($event, item)" *ngFor="let item of filteredPrincipalItems"
                    class="sidebar__option ">
                    <div *ngIf="item.badge !== 0" class="sidebar__option-icon"> <i class="{{ item.icon }}" pBadge
                            severity="info" [value]="item.badge"></i></div>
                    <div *ngIf="item.badge === 0" class="sidebar__option-icon"> <i class="{{ item.icon }}"></i></div>
                </div>




            </div>
            <div class="sidebar__profile">
                <div *ngIf="sidaberOptions.profileItems" class="sidebar__title">
                    <span>{{sidaberOptions.profileTitle}}</span>
                </div>
                <div [routerLink]="item.path" routerLinkActive="sidebar__option--active"
                    *ngFor="let item of filteredProfileItems" class="sidebar__option">
                    <div *ngIf="item.badge !== 0" class="sidebar__option-icon">
                        <img *ngIf="item.path === '/admin/profile' && userPhotoUrl" [src]="userPhotoUrl"
                            class="sidebar-user-photo" alt="User">
                        <i *ngIf="!(item.path === '/admin/profile' && userPhotoUrl)" class="{{ item.icon }}" pBadge
                            severity="info" [value]="item.badge"></i>
                    </div>
                    <div *ngIf="item.badge === 0" class="sidebar__option-icon">
                        <img *ngIf="item.path === '/admin/profile' && userPhotoUrl" [src]="userPhotoUrl"
                            class="sidebar-user-photo" alt="User">
                        <i *ngIf="!(item.path === '/admin/profile' && userPhotoUrl)" class="{{ item.icon }}"></i>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
