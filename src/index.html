<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Montao GPS</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#c43131">
  <link rel="icon" type="image/png" sizes="200x200" href="/logo/favicon.png">
  <link rel="shortcut icon" type="image/png" href="/logo/favicon.png">
  <link rel="apple-touch-icon" href="/logo/favicon.png">
  <link rel="manifest" href="/site.webmanifest">
  <style>
    /* Pantalla previa al arranque. Sin sintaxis moderna de CSS ni de JS: en un
       navegador viejo que no entienda el paquete de la aplicación, esto es lo
       único que se verá, y debe explicar qué pasa en vez de dejarlo en blanco. */
    #montao-arranque {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #ffffff;
      color: #2b2b2b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      text-align: center;
      padding: 24px;
      z-index: 2147483000;
    }
    #montao-arranque .montao-arranque-caja {
      max-width: 440px;
      margin: 18vh auto 0;
    }
    #montao-arranque img {
      width: 72px;
      height: 72px;
      margin-bottom: 18px;
    }
    #montao-arranque h1 {
      font-size: 19px;
      margin: 0 0 10px;
    }
    #montao-arranque p {
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 10px;
      color: #5a5a5a;
    }
    #montao-arranque .montao-arranque-detalle {
      font-size: 12px;
      color: #8a8a8a;
      word-wrap: break-word;
    }
    #montao-arranque .montao-arranque-aviso {
      display: none;
    }
    #montao-arranque.montao-arranque--incompatible .montao-arranque-cargando {
      display: none;
    }
    #montao-arranque.montao-arranque--incompatible .montao-arranque-aviso {
      display: block;
    }
  </style>
</head>
<body>
  <app-root></app-root>

  <div id="montao-arranque">
    <div class="montao-arranque-caja">
      <img src="/logo/favicon.png" alt="Montao GPS">
      <div class="montao-arranque-cargando">
        <h1>Cargando Montao GPS…</h1>
        <p>Un momento, por favor.</p>
      </div>
      <div class="montao-arranque-aviso">
        <h1>Tu navegador no puede abrir Montao GPS</h1>
        <p>La aplicación necesita una versión más reciente del navegador. Actualiza Safari desde Preferencias del Sistema o abre la plataforma con Google Chrome.</p>
        <p class="montao-arranque-detalle" id="montao-arranque-detalle"></p>
      </div>
    </div>
  </div>

  <noscript>
    <div style="font-family:Arial,sans-serif;padding:24px;text-align:center">
      Montao GPS necesita JavaScript activado para funcionar.
    </div>
  </noscript>

  <script>
    (function () {
      var ESPERA_MAXIMA = 12000;
      var pantalla = document.getElementById('montao-arranque');
      var terminado = false;

      function arrancado() {
        var raiz = document.getElementsByTagName('app-root')[0];
        return !!(raiz && raiz.children && raiz.children.length > 0);
      }

      function ocultar() {
        if (terminado) { return; }
        terminado = true;
        if (pantalla && pantalla.parentNode) {
          pantalla.parentNode.removeChild(pantalla);
        }
      }

      function avisarIncompatible() {
        if (terminado || !pantalla) { return; }
        terminado = true;
        var detalle = document.getElementById('montao-arranque-detalle');
        if (detalle) {
          detalle.innerHTML = 'Datos para soporte: ' + navigator.userAgent;
        }
        pantalla.className = 'montao-arranque--incompatible';
      }

      var vigilante = setInterval(function () {
        if (arrancado()) {
          clearInterval(vigilante);
          ocultar();
        }
      }, 250);

      setTimeout(function () {
        clearInterval(vigilante);
        if (!arrancado()) { avisarIncompatible(); }
      }, ESPERA_MAXIMA);

      // Un paquete que el navegador no sabe interpretar avisa aquí antes de que
      // se agote la espera.
      window.addEventListener('error', function (evento) {
        var destino = evento && evento.target;
        var esScript = destino && destino.tagName === 'SCRIPT';
        var esSintaxis = evento && evento.message
          && (evento.message.indexOf('SyntaxError') > -1
            || evento.message.indexOf('Unexpected token') > -1
            || evento.message.indexOf('Unexpected identifier') > -1);
        if ((esScript || esSintaxis) && !arrancado()) { avisarIncompatible(); }
      }, true);
    })();
  </script>
</body>
</html>
